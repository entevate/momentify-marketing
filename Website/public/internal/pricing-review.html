<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Momentify Pricing Review</title>
<style>
  :root {
    --teal: #00BBA5; --blue: #1A56DB; --deep: #1F3395; --ink: #181818;
    --light: #F8F9FB; --line: rgba(24,24,24,0.10); --muted: rgba(24,24,24,0.58);
    --grad: linear-gradient(135deg, #00BBA5, #1A56DB);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal); }
  h1, h2 { font-weight: 500; text-wrap: balance; margin: 0; }
  .sub { font-weight: 300; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 860px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid rgba(24,24,24,0.06); vertical-align: top; }
  thead th { font-weight: 600; font-size: 12.5px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td:first-child { color: var(--muted); font-weight: 300; white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; }

  #gate { position: fixed; inset: 0; background: linear-gradient(160deg, #0d1b4d 0%, var(--deep) 55%, #123067 100%); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  .gate-card { background: #fff; border-radius: 16px; padding: 40px 36px; max-width: 400px; width: 100%; text-align: center; }
  .gate-card h1 { font-size: 22px; margin: 6px 0 8px; }
  .gate-card p { font-size: 13.5px; color: var(--muted); font-weight: 300; margin: 0 0 22px; line-height: 1.6; }
  .gate-card input { width: 100%; padding: 11px 14px; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; }
  .gate-card input:focus { outline: 2px solid var(--teal); outline-offset: 1px; border-color: transparent; }
  .gate-card button { width: 100%; margin-top: 12px; padding: 11px 0; font-size: 14px; font-weight: 500; color: #fff; background: var(--grad); border: 0; border-radius: 8px; cursor: pointer; font-family: inherit; }
  .gate-card button:focus-visible { outline: 3px solid rgba(0,187,165,0.5); outline-offset: 2px; }
  #gate-err { color: #C4322F; font-size: 12.5px; min-height: 18px; margin-top: 10px; }
  
  .review-band { background: #FFF6E3; border-bottom: 1px solid rgba(186,117,23,0.25); padding: 10px 0; font-size: 12.5px; color: #7a5410; }
  .hero { background: linear-gradient(160deg, #0d1b4d 0%, var(--deep) 55%, #123067 100%); color: #fff; padding: 72px 0 56px; }
  .hero h1 { font-size: 40px; margin: 14px 0 10px; }
  .hero .sub { font-size: 17px; color: rgba(255,255,255,0.72); max-width: 560px; line-height: 1.6; margin: 0; }
  section { padding: 56px 0; }
  section.alt { background: var(--light); }
  h2 { font-size: 26px; margin-bottom: 6px; }
  .section-sub { font-size: 14px; color: var(--muted); font-weight: 300; margin: 0 0 30px; max-width: 620px; line-height: 1.65; }

  .toggle-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 26px; }
  .pillset { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .pillset button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; font-family: inherit; }
  .pillset button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .pillset button:focus-visible { outline: 2px solid var(--teal); }
  .save-note { font-size: 12px; color: var(--teal); font-weight: 600; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; position: relative; }
  .card.popular { border: 2px solid var(--teal); }
  .badge-pop { position: absolute; top: -11px; left: 20px; font-size: 11px; font-weight: 600; color: #fff; background: var(--grad); padding: 3px 12px; border-radius: 999px; }
  .card h3 { font-size: 16px; font-weight: 500; margin: 0 0 4px; }
  .tagline { font-size: 12.5px; font-weight: 300; color: var(--muted); min-height: 38px; margin: 0 0 12px; line-height: 1.5; }
  .price { font-size: 30px; font-weight: 500; }
  .price small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .price-note { font-size: 11.5px; color: var(--muted); margin: 2px 0 14px; min-height: 15px; }
  .card ul { list-style: none; margin: 0 0 18px; padding: 0; flex: 1; }
  .card li { font-size: 12.5px; font-weight: 300; color: rgba(24,24,24,0.78); padding: 3.5px 0 3.5px 20px; position: relative; line-height: 1.45; }
  .card li::before { content: "✓"; position: absolute; left: 0; color: var(--teal); font-weight: 600; }
  .cta { display: block; text-align: center; font-size: 13px; font-weight: 500; padding: 10px 0; border-radius: 8px; text-decoration: none; font-family: inherit; width: 100%; }
  .cta.soon { color: #fff; background: var(--grad); opacity: 0.55; border: 0; cursor: not-allowed; }
  .cta.sales { color: var(--ink); border: 1px solid var(--line); background: #fff; }
  .soon-note { font-size: 10.5px; color: var(--muted); text-align: center; margin: 6px 0 0; }
  .solo-strip { margin-top: 28px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .solo-strip .price { font-size: 24px; }
  .chip { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #FAEEDA; color: #854F0B; white-space: nowrap; }

  .trust { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 30px; font-size: 13px; font-weight: 300; color: var(--muted); }
  .trust span::before { content: "✓ "; color: var(--teal); font-weight: 600; }

  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .changed { background: rgba(0,187,165,0.10); }
  .changed-chip { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #085041; background: #9FE1CB; border-radius: 999px; padding: 1.5px 8px; margin-left: 8px; vertical-align: 1px; }
  .legend { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin: 14px 2px 0; }
  .legend i { width: 14px; height: 14px; border-radius: 4px; background: rgba(0,187,165,0.25); display: inline-block; }

  .notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .note { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
  .note h3 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  .note p { font-size: 13px; font-weight: 300; line-height: 1.65; color: rgba(24,24,24,0.78); margin: 0; }
  footer { padding: 30px 0 48px; font-size: 12px; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .gate-card { animation: rise 0.35s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <div class="eyebrow">Momentify internal</div>
    <h1>Pricing review</h1>
    <p>This page is for internal review of the new pricing structure. Enter the passphrase Jake shared with you. The content is encrypted until the passphrase is entered.</p>
    <input id="pw" type="password" placeholder="Passphrase" aria-label="Passphrase" autocomplete="off" />
    <button id="unlock">View the review</button>
    <div id="gate-err" role="alert"></div>
  </div>
</div>
<div id="content" style="display:none"></div>

  var b = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var input = document.getElementById("pw");
  var err = document.getElementById("gate-err");
  var busy = false;

  function initPricing() {
    var cadence = "annual";
    function fmt(n) { return "$" + Number(n).toLocaleString("en-US"); }
    function render() {
      document.querySelectorAll(".price[data-annual]").forEach(function (el) {
        el.innerHTML = fmt(el.dataset[cadence]) + "<small>/mo</small>";
      });
      document.querySelectorAll("[data-note]").forEach(function (el) {
        var base = cadence === "annual" ? "per month, billed annually" : "billed monthly";
        var fee = el.dataset.onboarding;
        el.textContent = cadence === "monthly" && fee ? base + " + " + fee : base;
      });
      document.getElementById("save-note").style.visibility = cadence === "annual" ? "visible" : "hidden";
      document.getElementById("t-annual").setAttribute("aria-pressed", String(cadence === "annual"));
      document.getElementById("t-monthly").setAttribute("aria-pressed", String(cadence === "monthly"));
    }
    document.getElementById("t-annual").addEventListener("click", function () { cadence = "annual"; render(); });
    document.getElementById("t-monthly").addEventListener("click", function () { cadence = "monthly"; render(); });
    render();
  }

  function tryUnlock() {
    if (busy) return;
    busy = true;
    err.textContent = "Decrypting...";
    var pass = input.value.trim().toLowerCase();
    crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (km) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b(SALT), iterations: 200000, hash: "SHA-256" },
          km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function (key) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: b(IV) }, key, b(DATA)); })
      .then(function (plain) {
        var content = document.getElementById("content");
        content.innerHTML = new TextDecoder().decode(plain);
        document.getElementById("gate").style.display = "none";
        content.style.display = "block";
        initPricing();
      })
      .catch(function () {
        err.textContent = "That passphrase is not right. Check with Jake.";
        input.select();
      })
      .finally(function () { busy = false; });
  }
  document.getElementById("unlock").addEventListener("click", tryUnlock);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
})();
